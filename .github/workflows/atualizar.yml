name: Atualizar painel

on:
  schedule:
    - cron: "0 11 * * 1"   # toda segunda-feira, 08:00 (horário de Brasília)
  workflow_dispatch: {}     # permite rodar manualmente pela aba Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar dados da Anatel e gerar a página
        run: python3 atualizar.py

      - name: Guardar a página gerada no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git diff --cached --quiet || git commit -m "Atualiza dados ($(date +%Y-%m-%d))"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
